<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Nos hemos mudado! — wowtopgear.app</title>
  
  <!-- Redirección automática de respaldo tras 4 segundos -->
  <meta http-equiv="refresh" content="4;url=https://wowtopgear.app/" />
  <link rel="canonical" href="https://wowtopgear.app/" />

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    @keyframes pulse-portal {
      0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 25px rgba(234, 179, 8, 0.4)); }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 45px rgba(234, 179, 8, 0.75)); }
    }
    .portal-anim {
      animation: pulse-portal 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#090b11] text-slate-200 min-h-screen flex items-center justify-center p-4 selection:bg-amber-500 selection:text-black font-sans relative overflow-hidden">

  <!-- Resplandor de fondo ambiental -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(245,158,11,0.08)_0%,transparent_70%)] pointer-events-none"></div>

  <div class="max-w-lg w-full bg-[#121520] border border-amber-500/30 rounded-3xl p-6 sm:p-10 text-center shadow-2xl relative z-10 space-y-6">
    
    <!-- Icono Portal Animado -->
    <div class="relative w-20 h-20 mx-auto flex items-center justify-center">
      <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-amber-500/30 to-purple-600/30 blur-xl portal-anim"></div>
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-amber-500/20 via-[#181c2b] to-yellow-600/10 border border-amber-500/50 flex items-center justify-center text-amber-400 text-3xl shadow-inner relative z-10">
        <i class="fa-solid fa-compass-drafting portal-anim"></i>
      </div>
    </div>

    <!-- Título y mensaje -->
    <div class="space-y-2">
      <span class="text-[10px] uppercase font-bold tracking-widest px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
        NUEVO DOMINIO OFICIAL
      </span>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
        ¡Nos hemos mudado!
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 leading-relaxed max-w-sm mx-auto">
        El Optimizador y Simulador de Equipo de WoW ahora tiene su propio hogar oficial más rápido y seguro en:
      </p>
    </div>

    <!-- Nuevo Dominio Destacado -->
    <div class="bg-black/60 border border-amber-500/40 rounded-2xl p-4 shadow-inner flex items-center justify-center gap-2 group">
      <i class="fa-solid fa-globe text-amber-400 text-sm"></i>
      <a href="https://wowtopgear.app/" class="text-base sm:text-lg font-mono font-extrabold text-amber-300 hover:text-white transition tracking-wide">
        wowtopgear.app
      </a>
      <i class="fa-solid fa-arrow-up-right-from-square text-amber-400/60 text-xs"></i>
    </div>

    <!-- Temporizador y Barra de progreso -->
    <div class="space-y-2 pt-2">
      <div class="text-xs text-slate-400 flex items-center justify-center gap-1.5">
        <span>Redirigiendo automáticamente en</span>
        <span id="countdown" class="font-bold font-mono text-amber-400 text-sm">3</span>
        <span>segundos...</span>
      </div>
      <div class="w-full bg-slate-800/80 rounded-full h-1.5 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-yellow-400 h-full w-full transition-all duration-1000 ease-linear"></div>
      </div>
    </div>

    <!-- Botón directo de acción -->
    <div class="pt-2">
      <a href="https://wowtopgear.app/" class="inline-flex items-center justify-center gap-2.5 w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-black font-extrabold text-sm shadow-xl shadow-amber-950/50 border border-yellow-200/50 transition transform active:scale-95 hover:scale-[1.02] min-h-[46px]">
        <span>Entrar a wowtopgear.app</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>

    <!-- Nota al pie -->
    <p class="text-[11px] text-slate-500">
      Por favor actualiza tus marcadores y favoritos a <strong class="text-slate-400 font-mono">wowtopgear.app</strong>
    </p>

  </div>

  <script>
    // Contador regresivo y redirección inmediata si es necesario
    let secondsLeft = 3;
    const countdownEl = document.getElementById('countdown');
    const progressBar = document.getElementById('progress-bar');
    
    // Animar barra
    setTimeout(() => {
      if (progressBar) progressBar.style.width = '0%';
    }, 50);

    const interval = setInterval(() => {
      secondsLeft--;
      if (countdownEl) countdownEl.textContent = Math.max(0, secondsLeft);
      if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.replace('https://wowtopgear.app/');
      }
    }, 1000);
  </script>

</body>
</html>
