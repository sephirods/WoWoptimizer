name: Auto Sync Blizzard Official Articles

on:
  schedule:
    # Se ejecuta cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ejecución manual permitida

permissions:
  contents: write

jobs:
  sync-blizzard-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Crawl Blizzard Official News
        run: node scripts/blizzard_crawler.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/wow_news_data.js scripts/latest_blizzard_news.json staging/mock_blizzard_data.js
          if git diff --staged --quiet; then
            echo "No hay nuevas noticias oficiales de Blizzard."
          else
            git commit -m "chore(news): auto-sync Blizzard official articles [skip ci]"
            git push origin main
          fi
