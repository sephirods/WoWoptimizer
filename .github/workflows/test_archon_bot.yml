name: Test Archon Presets Cloudflare Access

on:
  workflow_dispatch: # Se ejecuta únicamente cuando pulses el botón "Run workflow" manualmente en GitHub Actions

jobs:
  test_cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Archon Cloudflare Test
        run: |
          node tools/test_archon_bot.js
