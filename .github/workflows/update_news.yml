name: Sync WoW News Automatically

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  update-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run Blizzard Crawler
        run: |
          node scripts/blizzard_crawler.js

      - name: Run Wowhead Crawler & Auto-Merge
        run: |
          node scripts/batch_news_processor.js

      - name: Commit and Push Changes If Updated
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/wow_news_data.js scripts/latest_scraped_news.json scripts/latest_blizzard_news.json staging/
          if git diff --staged --quiet; then
            echo "No hay noticias nuevas. Repositorio al día."
          else
            git commit -m "chore(auto-news): sync latest Blizzard and Wowhead news [skip ci]"
            git push origin main
          fi
