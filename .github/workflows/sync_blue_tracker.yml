name: Auto Sync Blizzard Blue Tracker

on:
  schedule:
    # Se ejecuta cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ejecución manual permitida

permissions:
  contents: write

jobs:
  sync-blue-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Blue Tracker Posts
        run: node build_news_snapshot.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/wow_news_data.js
          if git diff --staged --quiet; then
            echo "No hay nuevos blue posts para publicar."
          else
            git commit -m "chore(news): auto-sync Blizzard blue tracker [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
