name: Auto Sync Wowhead Recent News

on:
  schedule:
    # Se ejecuta cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Ejecución manual permitida

permissions:
  contents: write

jobs:
  sync-wowhead-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Crawl & Process Wowhead News
        run: node scripts/batch_news_processor.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/wow_news_data.js scripts/latest_scraped_news.json staging/mock_news_data.js
          if git diff --staged --quiet; then
            echo "No hay nuevas noticias de Wowhead para publicar."
          else
            git commit -m "chore(news): auto-sync Wowhead recent news & guides [skip ci]"
            git checkout -- . || true
            git pull --rebase origin main
            git push origin main
          fi
